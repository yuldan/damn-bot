# CI per PR dan push main (ENGINEERING §5, ROADMAP F1 #0, ADR-073, ADR-135, ADR-179). Setiap job (kecuali
# `changes` dan `ci-required`) memanggil target Makefile yang sama dengan lokal (GAP-INF-05), sehingga
# `make meta-test` menguji perintah yang sama. Action dipin SHA commit + komentar versi, checkout tanpa
# kredensial tersimpan (AUD-070). Hemat menit runner (repo privat; macOS ×10, Windows ×2): hanya `test`
# berjalan di matrix OS, gate lain (lint, size, loc, …) cukup di ubuntu karena hasilnya tidak bergantung
# OS host.
#
# ADR-135 (antrean CI): PR docs-only melewati job Go, PR menjalankan matrix `test` yang diperkecil, dan
# `cancel-in-progress` hanya untuk PR (push main dan nightly tidak pernah dibatalkan). Status wajib branch
# protection adalah job agregat `ci-required`: ia selalu berjalan dan lulus bila setiap gate sukses atau
# dilewati sah oleh path/tier, sehingga job yang dilewati tidak membuat PR menggantung "Expected".
#
# ADR-179 (slot runner): setiap gate Makefile tetap berjalan tepat sekali dengan perintah dan tag yang
# sama; yang berubah hanya pengemasan job. Gate pendek yang tidak saling bergantung dijalankan berurutan
# di dalam satu job (`static`, `portability`, `supply`) dan tiga shard fuzz berjalan di satu job.
# `lint` tetap job tersendiri untuk umpan balik cepat; ADR-324 memisahkan `test-timing` dan gate berat
# lain ke tier penuh dengan job masing-masing.
#
# ADR-324 (dua tingkat + smoke, 2026-11-04; menggantikan ADR-179 butir 8): `pull_request` = tier `pr`
# — matrix `test` dua target (ubuntu-latest dan windows-latest, keduanya `-race`/cgo) + gate murah
# (`lint`, `static`, `phase`, `e2e`, `bench`, `supply`, `skill-refs`, `sqlite-engine`, `deadcode-linux`).
# `push: main` = tier `smoke` (ADR-181): `lint`, `static`, `smoke` (`make build`, `make vet-cross`, suite
# paket inti cepat) = 5 instance `ci`, ditambah `deadcode-linux` (E-53 GOOS linux, ADR-324 amandemen
# 2026-11-09) menjadi 6 saat kode berubah — bukan tier penuh, karena run main tidak bisa dibatalkan dan
# tidak boleh menyerap biaya gate PR. `merge_group`, nightly (`workflow_call`), dan `workflow_dispatch` = tier
# `full`: matrix enam target + seluruh gate berat (`test-timing`, `deadcode`, `portability` =
# vet-cross + build-matrix, `fuzz`, `perf`, `coverage`, `bench-parity`). Merge queue menjalankan tier
# penuh SEBELUM merge; selama queue belum aktif (repo user-owned), regresi OS-spesifik/gate berat
# terdeteksi di nightly + `workflow_dispatch`, dan `push main` boleh dinaikkan ke tier penuh saat queue
# diaktifkan. `ci-required` memeriksa himpunan gate yang WAJIB per konteks (`pr`/`smoke`/`full`): gate
# wajib harus `success`, gate di luar konteks harus `skipped` — skip tanpa alasan menggagalkan agregat.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # ADR-324: merge queue menjalankan tier penuh terhadap merge commit (github.sha).
  workflow_call: # ADR-135: nightly menjalankan matrix PENUH lewat workflow ini.
  workflow_dispatch: # ADR-324: verifikasi tier penuh atas permintaan (branch mana pun).

permissions:
  contents: read

# ADR-135 butir 1: cancel-in-progress hanya untuk PR. Push `main` (dan nightly via workflow_call) memakai
# grup yang sama tetapi tidak pernah dibatalkan — run baru menunggu, run lama selalu selesai.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"
  # ADR-182: `|direct` = fallback ke sumber (VCS) bila proxy mengembalikan error APA PUN (comma hanya
  # fallback pada 404/410). Ini tidak melewati gate apa pun — unduhan modul tetap wajib sukses; hanya
  # jalur pengambilan yang tahan gangguan transient proxy.golang.org (mis. `stream error: … INTERNAL_ERROR`).
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  # ADR-135 butir 2: PR yang hanya menyentuh dokumen tidak menjalankan build/test/perf/coverage/fuzz.
  # Dokumen yang isinya divalidasi test Go (SPEC.md, §2.4/budget ENGINEERING, DECISIONS, ROADMAP,
  # FEATURE-PARITY, CODE-TOOLS, ATTRIBUTION) tetap memicu job Go. Bukan PR (push main, workflow_call):
  # selalu jalankan semua job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tier: ${{ steps.filter.outputs.tier }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
      sqlite_matrix: ${{ steps.filter.outputs.sqlite_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
          fetch-depth: 0
      - name: PR docs-only?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # ADR-324: tiga tier. `pull_request` = `pr` (dua target); `push: main` = `smoke` (matrix
          # tidak dipakai karena `test` dilewati); `merge_group`/nightly/`workflow_dispatch` = `full`
          # (enam target berrunner: linux amd64/arm64, darwin arm64/amd64, windows amd64/arm64;
          # windows/arm64 tanpa -race, ADR-073).
          full='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"ubuntu-24.04-arm","race":"-race","cgo":"1"},{"os":"macos-latest","race":"-race","cgo":"1"},{"os":"macos-15-intel","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"},{"os":"windows-11-arm","race":"","cgo":"0"}]}'
          reduced='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"}]}'
          # ADR-324 amandemen: `sqlite-engine` (GAP-REL-04) tetap gate wajib di semua tier, tetapi
          # matrix-nya dikecilkan di PR. PR hanya membuktikan tiga target Linux/QEMU-kanonik; lima
          # leg berrunner mahal (ubuntu-24.04-arm, darwin/arm64, darwin/amd64, windows/amd64,
          # windows/arm64) dipindah ke tier `full` (merge_group/nightly/workflow_dispatch).
          sqlite_pr='{"include":[{"os":"ubuntu-latest","target":"linux/amd64","mode":"run"},{"os":"ubuntu-latest","target":"linux/arm","mode":"cross"},{"os":"ubuntu-latest","target":"android/arm64","mode":"cross"}]}'
          sqlite_full='{"include":[{"os":"ubuntu-latest","target":"linux/amd64","mode":"run"},{"os":"ubuntu-24.04-arm","target":"linux/arm64","mode":"run"},{"os":"ubuntu-latest","target":"linux/arm","mode":"cross"},{"os":"macos-latest","target":"darwin/arm64","mode":"run"},{"os":"macos-15-intel","target":"darwin/amd64","mode":"run"},{"os":"windows-latest","target":"windows/amd64","mode":"run"},{"os":"windows-11-arm","target":"windows/arm64","mode":"run"},{"os":"ubuntu-latest","target":"android/arm64","mode":"cross"}]}'
          # Gate berat (fuzz, bench-parity, coverage, perf, test-timing, deadcode, vet-cross,
          # build-matrix) hanya tier `full`. `push main` tier `smoke` sengaja tidak menjalankan gate
          # PR/berat: run main tidak bisa dibatalkan dan antreannya tidak boleh macet. Daftar gate
          # wajib per konteks ditegakkan `ci-required` (gate wajib harus sukses, bukan skipped).
          case "$EVENT" in
            pull_request) tier=pr; echo "test_matrix=$reduced" >>"$GITHUB_OUTPUT"; echo "sqlite_matrix=$sqlite_pr" >>"$GITHUB_OUTPUT" ;;
            push) tier=smoke; echo "test_matrix=$reduced" >>"$GITHUB_OUTPUT"; echo "sqlite_matrix=$sqlite_pr" >>"$GITHUB_OUTPUT" ;;
            *) tier=full; echo "test_matrix=$full" >>"$GITHUB_OUTPUT"; echo "sqlite_matrix=$sqlite_full" >>"$GITHUB_OUTPUT" ;;
          esac
          echo "tier=$tier" >>"$GITHUB_OUTPUT"
          if [ "$tier" != pr ]; then
            echo "bukan PR (tier=$tier): semua job tier itu berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan semua job Go"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          # Dokumen yang dibaca test Go (readRepoFile/parity/codetools/attribution) atau mendefinisikan
          # budget: perubahan di sini wajib menjalankan test yang memvalidasinya.
          validated='^(SPEC\.md|docs/(ENGINEERING|DECISIONS|ROADMAP|FEATURE-PARITY|CODE-TOOLS|ATTRIBUTION)\.md)$'
          # Docs-only = setiap path di docs/** ATAU Markdown di AKAR repo (README/CHANGELOG). Markdown di
          # subdirektori lain (internal/**/testdata/SKILL.md, template, golden, .github/*.md) bukan docs:
          # file itu dibaca test/kode Go dan tetap memicu semua job Go (ADR-135 butir 2).
          if printf '%s\n' "$changed" | grep -Ev '^(docs/|[^/]*\.md$)' | grep -q .; then
            echo "ada path non-dokumen: job Go berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq "$validated"; then
            echo "dokumen divalidasi test berubah: job Go berjalan"
            printf '%s\n' "$changed" | grep -E "$validated"
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs-only: job Go dilewati, gate dokumen tetap berjalan"
            printf '%s\n' "$changed"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: golangci-lint (E-51)
        run: make lint
      - name: Analyzer khusus nohttpclient (E-05)
        run: make vet-custom

  # E-55: 6 target berrunner — linux amd64/arm64, darwin arm64/amd64, windows amd64/arm64 (linux/arm +
  # android/arm64 di QEMU tetap F9, ADR-073). ADR-090: ctxdb Windows termasuk TestFileLockSemantics,
  # S023, S044, TestPlatformNAList. windows/arm64 tanpa -race (Go tidak punya race detector di sana).
  # ADR-324: tier `pr` cukup ubuntu-latest + windows-latest (keduanya amd64, `-race`/cgo); tier `full`
  # (merge_group, nightly/workflow_dispatch) menjalankan keenam target; tier `smoke` (push main) tidak
  # menjalankan `test` (suite inti ada di job `smoke`).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    # Batas infrastruktur, bukan gate tes: suite `make test RACE=-race` di runner lambat pernah
    # dibunuh timeout tanpa satu pun `--- FAIL` — Windows menyentuh 25m13s (bukti #595 head 34f08824,
    # job 17:58:49Z→18:24:02Z), macOS runtuh tepat ~25m (bukti #622 head 3ad36dd3, run 41435355692,
    # 11:16:42Z→11:41:25Z, hanya job macos berstatus cancelled). Amandemen ADR-324 (F9 installer,
    # run 43196971160): ubuntu dibatalkan 25m15s dua kali tanpa `--- FAIL` setelah suite e2e installer
    # bertambah; Windows 35, macOS 40, target lain 35.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 35 || (startsWith(matrix.os, 'macos') && 40 || 35) }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }} # -race butuh cgo; build rilis tetap CGO_ENABLED=0 (job static, portability)
      # ADR-324 amandemen (batas infrastruktur, bukan gate tes): plafon `go test -timeout` per binary
      # paket dinaikkan untuk macOS dan ubuntu. `cmd/damnbot` di `macos-15-intel` selesai 1065,132 s
      # (SHA c46d06e3, run 41962495294) tetapi SHA f1c9504c (run 41968483834, attempt 1&2) panic
      # `test timed out after 20m0s`; F9 installer membuat `internal/e2e` ubuntu 1320 s (run
      # 43224709334) dan juga panic 20m tanpa `--- FAIL`. Default 20m tetap untuk lokal/windows
      # (Makefile `TEST_TIMEOUT ?= 20m`); asersi/`t.Skip` tidak berubah.
      TEST_TIMEOUT: ${{ (startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu')) && '30m' || '20m' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum # kunci cache = go.sum + versi Go (dalam kunci setup-go)
      - name: GNU make tersedia (image Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - run: make test RACE="${{ matrix.race }}"
      # Amandemen ADR-324 (bukti acceptance, ADR-165): `make test` hanya mencetak `ok <pkg> <durasi>`,
      # jadi tes Windows yang bernama tidak terlihat di log. Step ini hanya mencetak nama tes yang
      # benar-benar dieksekusi; `make test` di atas tetap gate suite satu-satunya, tanpa `-race` tambahan.
      - name: Bukti eksekusi tes Windows (nama tes di log)
        if: runner.os == 'Windows'
        run: make test-windows-evidence RACE="${{ matrix.race }}"

  # ADR-048 (TS-P08): budget waktu dinding tanpa -race; cek kebenaran skenario yang sama tetap berjalan
  # di job `test` (-race). Job tersendiri (bukan digabung seperti gate lain, ADR-179): asersi waktu dinding
  # tidak dibagi dengan langkah berat lain di runner yang sama.
  # ADR-324: `test-timing` dipindah dari PR ke tier `full` (merge_group, push main, nightly) — budget
  # waktu dinding tetap ditegakkan sebelum merge di antrean, tanpa membebani setiap PR.
  test-timing:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-timing

  # ADR-324: gate statis murah yang tetap per-PR — E-19/E-61/E-70 (`make loc`, `make loc-ratio`), E-62
  # (`make size-check`), E-39 (`make build-minimal-all`), GAP-COST-01 (`make prices-gate`).
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: LOC per paket + total, direktori tak terpetakan (E-19, AUD-073)
        run: make loc
      - name: Rasio test:source (E-70)
        run: make loc-ratio
      - name: Ukuran binary + arsip (E-62)
        run: make size-check
      # E-39: `size-check` hanya membangun `cmd/damnbot`, jadi paket yang memakai simbol full-only
      # tanpa `//go:build !minimal` tidak terlihat. Gate ini mengompilasi seluruh paket.
      - name: Semua paket kompilasi dengan tag minimal (E-39)
        run: make build-minimal-all
      # GAP-COST-01 (ADR-125 butir 4): a price past its Until leaves the route
      # unpriced, so a monetary cap fails closed. Named gate: the failure lists
      # the stale entries.
      - name: Harga registry belum kedaluwarsa (GAP-COST-01)
        run: make prices-gate

  # ADR-324: E-53 dipindah ke tier `full` (merge_group, push main, nightly) karena `deadcode -test`
  # untuk tiga GOOS lebih berat daripada gate statis lain dan tetap memblokir merge lewat antrean.
  deadcode:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Kode mati, 3 GOOS digabung (E-53)
        run: make deadcode

  # ADR-324 amandemen (2026-11-09): gate E-53 GOOS linux berjalan di SETIAP tier yang mengubah kode,
  # termasuk `pr`. Gate 3-GOOS tier `full` tidak berjalan di PR, sehingga fungsi tak terjangkau
  # `internal/connectors/token.go:91` (`tokenCache.Calls`) lolos ke main lewat #817/#818 (PR #819
  # memperbaikinya). Satu GOOS = biaya `deadcode` terukur (~39 s, ADR-179), bukan gate berat.
  deadcode-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 1500MiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Kode mati GOOS linux (E-53, ADR-324 amandemen)
        run: |
          ulimit -v 8388608
          make deadcode-linux

  # ADR-073 (AUD-033) + E-39/E-65: `go vet` lintas OS/arch dan build 8 target kanonik
  # (CGO_ENABLED=0 -tags goolm). ADR-324: dipindah dari PR ke tier `full`; keduanya memblokir merge
  # lewat merge queue dan tetap berjalan di push main + nightly.
  portability:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet windows/darwin × amd64/arm64 (ADR-073)
        run: make vet-cross
      - name: Build 8 target kanonik (E-39, E-65)
        run: make build-matrix

  # E-57: 60 s per target Fuzz*, tiga shard. Shard berjalan berurutan di satu job (ADR-179), dan
  # ADR-324 memindahkannya ke tier `full` (merge_group, push main, nightly): fuzz memblokir merge
  # lewat antrean, bukan dijalankan ulang di setiap PR.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz shard 1/3 (E-57)
        run: make fuzz SHARD=1/3
      - name: Fuzz shard 2/3 (E-57)
        run: make fuzz SHARD=2/3
      - name: Fuzz shard 3/3 (E-57)
        run: make fuzz SHARD=3/3

  # ADR-324: acceptance fase tetap per-PR dan hanya berjalan bila `PHASE` berubah, jadi biayanya kecil
  # (satu checkout + satu `go test` fase). Gate ini tidak dipindah ke merge queue karena ia menjaga
  # transisi fase, bukan matrix OS.
  phase:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: PHASE berubah?
        id: phase
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan acceptance fase"; echo "run=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qx PHASE; then
            echo "PHASE berubah: $(cat PHASE)"; echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "PHASE tidak berubah: acceptance fase tidak perlu dijalankan"; echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.phase.outputs.run == 'true'
        run: make phase-acceptance

  # ADR-324: budget absolut benchmark + acceptance performa F2 dipindah ke tier `full`. Job tersendiri
  # supaya `make perf` (ADR-270: build semua binary lalu tiap paket pemilik benchmark serial `-p 1`)
  # diukur di runner yang belum dipakai langkah berat lain (ADR-179 butir 5).
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Budget absolut benchmark (-tags goolm,perf; NEW-38, ADR-077)
        run: make perf
      - name: Acceptance performa F2 (recall p95 @1M, append p99; SPEC §11.6/§11)
        run: make perf-acceptance

  # ADR-324: coverage paket kritis dipindah ke tier `full`; tetap memblokir merge lewat antrean dan
  # berjalan di push main + nightly (E-58, AUD-059).
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Coverage per paket critical (E-58, AUD-059)
        run: make coverage

  # Docker-positive execute_code e2e (F5 slice 5): the fixture image is built
  # locally so the runner never depends on a registry image tag. The test is
  # compiled under `e2e_docker` only (normal `make test` jobs do not see it) and
  # keeps skipOrFail hard: once this job exports the image, a broken docker
  # fixture fails CI instead of skipping. Platforms without docker are out of
  # scope here; the rest of the e2e suite still runs in `test`/`test-timing`.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build e2e docker fixture
        timeout-minutes: 10
        run: docker build -t damnbot-e2e:ci internal/e2e/testdata
      - name: execute_code docker positive (skipOrFail)
        env:
          DAMNBOT_E2E_DOCKER_IMAGE: damnbot-e2e:ci
        run: make e2e-docker

  # GAP-INF-03/GAP-SEC-22 (ADR-033 Q35/Q49): ubuntu runners carry a Docker daemon, so the
  # shipped Dockerfile is built and measured: image size ≤ release binary + 2 MB, UID 65532,
  # exec-form healthcheck, and no shell/compiler in the runtime image. The test is compiled
  # only under `e2e_docker`, and DAMNBOT_REQUIRE_DOCKER=1 makes a missing daemon fail (gate).
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build image + size/uid/shell check (GAP-INF-03)
        run: make image-test

  # GAP-INF-03/OPS-030: Nix flake (paket CGO=0 + devShell). The parse test needs no Nix,
  # so it always runs; `nix flake check` runs only when the runner already has Nix (hosted
  # runners do not install it, so the job adds no default download). When flake.nix has not
  # landed yet, the step is a no-op; the flake PR turns on the `make nix-check` path.
  nix:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Flake parse + nix flake check bila tersedia (GAP-INF-03)
        run: |
          if [ -f flake.nix ]; then
            make nix-check
          else
            echo "flake.nix belum ada (PR Nix menyusul); parse statis dilewati"
          fi

  # ADR-324: `bench-budget` (NEW2-07) tetap per-PR — cepat dan menjaga seluruh test modul bench.
  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - name: Seluruh test modul bench (NEW2-07)
        run: make bench-budget

  # ADR-324: CT-21 parity grep vs rg 15.1.0 di korpus nyata C1+C3 (`bench/corpora.lock`; tanpa korpus
  # test gagal, bukan skip: DAMNBOT_REQUIRE_CORPORA=1) dipindah ke tier `full`. Korpus + rg di-cache.
  # CT-01/02/03 dan CT-11 berjalan di nightly bench-codetools.
  bench-parity:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/damnbot-corpora
          key: corpora-c1c3-${{ hashFiles('bench/corpora.lock', 'scripts/corpora.sh', 'bench/gencorpus/**') }}
      - name: Parity grep vs rg di korpus C1+C3 (CT-21, E-59)
        run: make bench-parity CORPORA="C1 C3 rg" CORPORA_DIR="$RUNNER_TEMP/damnbot-corpora"

  # E-46/E-47/E-50 (tidy, verify, deps.allow, go-licenses + TestMPLIsolation) dan E-54 (govulncheck).
  # Satu job (ADR-179): semuanya membaca modul/ketergantungan yang sama. ADR-324: tetap per-PR.
  supply:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            bench/go.sum
      # ADR-182: retry idempoten hanya pada jalur unduhan yang tersentuh gate, bukan pra-unduh.
      # Pra-unduh `go mod download all` DITOLAK karena ia menulis go.sum (8 baris untuk 4 modul pada
      # pohon nyata) dan membuat gate `tidy-check` di langkah berikutnya gagal — persis kegagalan yang
      # terlihat di PR ini. Gate tetap tidak dilonggarkan: bila 3 percobaan gagal, langkah gagal.
      - name: Gate modul dengan retry transient (E-46/E-47/E-45/E-48/E-40/E-54; ADR-182)
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if (( n >= 3 )); then
                echo "::error::$*: gagal setelah 3 percobaan (transient?)"
                return 1
              fi
              echo "$*: percobaan $n gagal; jeda 5 s lalu ulang"
              sleep 5
            done
          }
          retry make tidy-check
          retry make mod-verify
          retry make deps-check
          retry make licenses
          retry make release-test
          retry make vuln

  # ADR-181/ADR-324: tier `smoke` untuk `push: main`. Run main tidak bisa dibatalkan (ADR-135 butir 1)
  # dan isinya sudah diverifikasi PR yang di-squash + merge queue/nightly, jadi main hanya menjalankan
  # gate cepat yang menangkap kerusakan merge: kompilasi seluruh paket (`make build`, E-39), `go vet`
  # lintas OS/arch (`make vet-cross`, ADR-073), dan suite paket inti cepat (`make test RACE=-race
  # PKGS=…`, E-55) di luar paket ber-fixture berat (ctxdb, exec, codetools, e2e) yang tetap dijalankan
  # nightly. `lint` dan `static` berjalan di semua tier; `meta-test` datang dari meta.yml. Bila merge
  # queue diaktifkan, `push main` boleh dinaikkan ke tier `full` (ADR-324).
  smoke:
    needs: changes
    if: needs.changes.outputs.tier == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Kompilasi seluruh paket, CGO_ENABLED=0 -tags goolm (E-39)
        run: make build
      - name: go vet lintas OS/arch (ADR-073)
        run: make vet-cross
      - name: Suite paket inti cepat (E-55)
        env:
          CGO_ENABLED: "1" # ADR-181 amandemen: -race butuh cgo (pola sama dengan job `test` tier PR)
        run: make test RACE="-race" PKGS="./cmd/... ./internal/archtest/... ./internal/assemble/... ./internal/boundary/... ./internal/budget/... ./internal/compaction/... ./internal/config/... ./internal/journal/... ./internal/loop/... ./internal/memory/... ./internal/modules/... ./internal/netx/... ./internal/provider/... ./internal/redact/... ./internal/sandbox/... ./internal/schema/... ./internal/skills/... ./internal/testutil/... ./internal/tools/..."

  # GAP-SEC-26 (ADR-133/ADR-187): builtin skills carry no dangling requires,
  # skill:// links or script paths. The suite is empty today; the rule fires
  # the moment a builtin skill is added.
  skill-refs:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Builtin skill references (GAP-SEC-26)
        run: make skill-refs

  # GAP-REL-04 (ADR-132/ADR-187): the embedded SQLite engine must satisfy
  # REL-04 (>= 3.51.3 + FTS5/trigram/json_valid) on all 8 canonical E-39
  # targets. Enam target punya hosted runner; linux/arm dan android/arm64
  # memakai cross-compile sampai QEMU (F9, ADR-073). ADR-324 amandemen: tier
  # `pr` hanya tiga target Linux (linux/amd64 run + linux/arm & android/arm64
  # cross); lima leg berrunner mahal (arm64 Linux, dua macOS, dua Windows) ikut
  # tier `full` karena matrix ini bukan lagi gate murah. Job dan nama gate tidak
  # berubah; `ci-required` tetap mewajibkannya di `pr` dan `full`.
  sqlite-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.sqlite_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Engine probe (${{ matrix.target }})
        if: matrix.mode == 'run'
        run: make sqlite-engine
      - name: Cross-compile (${{ matrix.target }}, no runner; QEMU at F9)
        if: matrix.mode == 'cross'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: make sqlite-engine-cross GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"

  # ADR-135 butir 2 + ADR-324: satu-satunya status `ci` yang wajib di branch protection. Selalu
  # berjalan (termasuk docs-only) dan lulus hanya bila gate yang WAJIB untuk konteks ini `success`
  # dan gate di luar konteks `skipped`. Sebelumnya `skipped` diterima untuk semua gate, sehingga gate
  # yang salah kondisi bisa lolos diam-diam; sekarang skip tanpa alasan tier/path menggagalkan agregat.
  # Tiga himpunan: `pr`, `smoke` (push main), `full` (merge_group/nightly/workflow_dispatch).
  ci-required:
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-timing
      - static
      - deadcode
      - deadcode-linux
      - portability
      - fuzz
      - phase
      - perf
      - coverage
      - e2e
      - bench
      - bench-parity
      - supply
      - skill-refs
      - sqlite-engine
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # ADR-324: merge_group memakai merge commit, bukan ref sintetis.
          persist-credentials: false
      - name: Uji logika himpunan gate per tier (ADR-324)
        run: make ci-required-test
      - name: Rekap gate dan himpunan wajib per tier (E-78, ADR-324)
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
          CODE: ${{ needs.changes.outputs.code }}
        run: make ci-required
