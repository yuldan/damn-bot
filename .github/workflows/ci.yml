# CI per PR dan push main (ENGINEERING §5, ROADMAP F1 #0, ADR-073, ADR-135, ADR-179). Setiap job (kecuali
# `changes` dan `ci-required`) memanggil target Makefile yang sama dengan lokal (GAP-INF-05), sehingga
# `make meta-test` menguji perintah yang sama. Action dipin SHA commit + komentar versi, checkout tanpa
# kredensial tersimpan (AUD-070). Hemat menit runner (repo privat; macOS ×10, Windows ×2): hanya `test`
# berjalan di matrix OS, gate lain (lint, size, loc, …) cukup di ubuntu karena hasilnya tidak bergantung
# OS host.
#
# ADR-135 (antrean CI): PR docs-only melewati job Go, PR menjalankan matrix `test` yang diperkecil, dan
# `cancel-in-progress` hanya untuk PR (push main dan nightly tidak pernah dibatalkan). Status wajib branch
# protection adalah job agregat `ci-required`: ia selalu berjalan dan lulus bila setiap gate sukses atau
# dilewati sah oleh path/tier, sehingga job yang dilewati tidak membuat PR menggantung "Expected".
#
# ADR-179 (slot runner): setiap gate Makefile tetap berjalan tepat sekali dengan perintah dan tag yang
# sama; yang berubah hanya pengemasan job. Gate pendek yang tidak saling bergantung dijalankan berurutan
# di dalam satu job (`static`, `portability`, `bench`, `supply`, `extra`) dan tiga shard fuzz berjalan di
# satu job, sehingga satu PR-run memakai 13 job (dari 20) tanpa menghapus satu pun gate. `lint` dan
# `test-timing` tetap job tersendiri: keduanya memberi umpan balik cepat dan `test-timing` mengukur budget
# waktu dinding yang sebaiknya tidak dibagi dengan langkah berat lain.
#
# ADR-181 (pemisahan beban `main`): tier ketiga `smoke` untuk `push: main`. Setiap merge memicu run `main`
# yang tidak bisa dibatalkan (ADR-135 butir 1) dan isinya hampir seluruhnya sudah diverifikasi PR yang
# di-squash, sehingga ia hanya bersaing dengan PR di plafon runner. Push `main` kini menjalankan `changes`,
# `lint`, `static`, `smoke` (`make build`, `make vet-cross`, `make test` untuk paket inti cepat) dan
# `ci-required`; matriks penuh (6 target OS `-race`, `test-timing`, `fuzz`, `coverage`, `perf`, `bench`,
# `supply`) tetap jalan **di PR** (3 target OS) dan **di nightly/`workflow_dispatch`** (6 target,
# `nightly.yml` memanggil workflow ini lewat `workflow_call`). Tier PR tidak berubah sedikit pun.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # ADR-135: nightly menjalankan matrix PENUH lewat workflow ini.
  workflow_dispatch: # ADR-181: verifikasi tier penuh atas permintaan (branch mana pun).

permissions:
  contents: read

# ADR-135 butir 1: cancel-in-progress hanya untuk PR. Push `main` (dan nightly via workflow_call) memakai
# grup yang sama tetapi tidak pernah dibatalkan — run baru menunggu, run lama selalu selesai.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"
  # ADR-182: `|direct` = fallback ke sumber (VCS) bila proxy mengembalikan error APA PUN (comma hanya
  # fallback pada 404/410). Ini tidak melewati gate apa pun — unduhan modul tetap wajib sukses; hanya
  # jalur pengambilan yang tahan gangguan transient proxy.golang.org (mis. `stream error: … INTERNAL_ERROR`).
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  # ADR-135 butir 2: PR yang hanya menyentuh dokumen tidak menjalankan build/test/perf/coverage/fuzz.
  # Dokumen yang isinya divalidasi test Go (SPEC.md, §2.4/budget ENGINEERING, DECISIONS, ROADMAP,
  # FEATURE-PARITY, CODE-TOOLS, ATTRIBUTION) tetap memicu job Go. Bukan PR (push main, workflow_call):
  # selalu jalankan semua job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tier: ${{ steps.filter.outputs.tier }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: PR docs-only?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # ADR-135 butir 3: matrix `test` bertingkat. PR = 3 target (ubuntu race, macOS arm64, Windows
          # amd64); push main dan workflow_call (nightly) = 6 target berrunner.
          full='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"ubuntu-24.04-arm","race":"-race","cgo":"1"},{"os":"macos-latest","race":"-race","cgo":"1"},{"os":"macos-15-intel","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"},{"os":"windows-11-arm","race":"","cgo":"0"}]}'
          reduced='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"macos-latest","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"}]}'
          # ADR-181: tier ketiga untuk push `main`. Smoke = gate cepat yang menangkap kerusakan merge
          # (build, vet lintas-OS, paket inti, lint, loc/size/deadcode); matriks penuh dijalankan PR dan
          # nightly/workflow_dispatch.
          case "$EVENT" in
            pull_request) tier=pr; echo "test_matrix=$reduced" >>"$GITHUB_OUTPUT" ;;
            push) tier=smoke ;;
            *) tier=full; echo "test_matrix=$full" >>"$GITHUB_OUTPUT" ;;
          esac
          echo "tier=$tier" >>"$GITHUB_OUTPUT"
          if [ "$tier" != pr ]; then
            echo "bukan PR (tier=$tier): semua job tier itu berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan semua job Go"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          # Dokumen yang dibaca test Go (readRepoFile/parity/codetools/attribution) atau mendefinisikan
          # budget: perubahan di sini wajib menjalankan test yang memvalidasinya.
          validated='^(SPEC\.md|docs/(ENGINEERING|DECISIONS|ROADMAP|FEATURE-PARITY|CODE-TOOLS|ATTRIBUTION)\.md)$'
          # Docs-only = setiap path di docs/** ATAU Markdown di AKAR repo (README/CHANGELOG). Markdown di
          # subdirektori lain (internal/**/testdata/SKILL.md, template, golden, .github/*.md) bukan docs:
          # file itu dibaca test/kode Go dan tetap memicu semua job Go (ADR-135 butir 2).
          if printf '%s\n' "$changed" | grep -Ev '^(docs/|[^/]*\.md$)' | grep -q .; then
            echo "ada path non-dokumen: job Go berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq "$validated"; then
            echo "dokumen divalidasi test berubah: job Go berjalan"
            printf '%s\n' "$changed" | grep -E "$validated"
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs-only: job Go dilewati, gate dokumen tetap berjalan"
            printf '%s\n' "$changed"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: golangci-lint (E-51)
        run: make lint
      - name: Analyzer khusus nohttpclient (E-05)
        run: make vet-custom

  # E-55: 6 target berrunner — linux amd64/arm64, darwin arm64/amd64, windows amd64/arm64 (linux/arm +
  # android/arm64 di QEMU tetap F9, ADR-073). ADR-090: ctxdb Windows termasuk TestFileLockSemantics,
  # S023, S044, TestPlatformNAList. windows/arm64 tanpa -race (Go tidak punya race detector di sana).
  # ADR-135 butir 3: PR cukup ubuntu-latest + macos-latest (arm64) + windows-latest (amd64); push main
  # dan nightly menjalankan keenam target.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    # Batas infrastruktur, bukan gate tes: suite `make test RACE=-race` 73 paket di runner Windows
    # lambat pernah menyentuh 25m13s dan job dibunuh timeout tanpa satu pun `--- FAIL` (bukti #595
    # head 34f08824, job 17:58:49Z→18:24:02Z). Windows mendapat 35 menit; target lain tetap 25.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 35 || 25 }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }} # -race butuh cgo; build rilis tetap CGO_ENABLED=0 (job static, portability)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum # kunci cache = go.sum + versi Go (dalam kunci setup-go)
      - name: GNU make tersedia (image Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - run: make test RACE="${{ matrix.race }}"

  # ADR-048 (TS-P08): budget waktu dinding tanpa -race; cek kebenaran skenario yang sama tetap berjalan
  # di job `test` (-race). Job tersendiri (bukan digabung seperti gate lain, ADR-179): asersi waktu dinding
  # tidak dibagi dengan langkah berat lain di runner yang sama.
  test-timing:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-timing

  # ADR-179: gate statis pendek dalam satu job — E-19/E-61/E-70 (`make loc`, `make loc-ratio`), E-62
  # (`make size-check`), E-53 (`make deadcode`). Tidak ada gate yang hilang: perintahnya sama persis
  # dengan job terpisah sebelumnya, hanya berbagi satu checkout/setup-go.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: LOC per paket + total, direktori tak terpetakan (E-19, AUD-073)
        run: make loc
      - name: Rasio test:source (E-70)
        run: make loc-ratio
      - name: Ukuran binary + arsip (E-62)
        run: make size-check
      - name: Kode mati, 3 GOOS digabung (E-53)
        run: make deadcode
      # GAP-COST-01 (ADR-125 butir 4): a price past its Until leaves the route
      # unpriced, so a monetary cap fails closed. Named gate: the failure lists
      # the stale entries.
      - name: Harga registry belum kedaluwarsa (GAP-COST-01)
        run: make prices-gate

  # ADR-073 (AUD-033) + E-39/E-65: `go vet` lintas OS/arch dan build 8 target kanonik
  # (CGO_ENABLED=0 -tags goolm). Dua perintah berbeda, satu job (ADR-179).
  portability:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet windows/darwin × amd64/arm64 (ADR-073)
        run: make vet-cross
      - name: Build 8 target kanonik (E-39, E-65)
        run: make build-matrix

  # E-57: 60 s per target Fuzz*, tiga shard. Shard berjalan berurutan di satu job (ADR-179): target dan
  # FUZZTIME identik dengan tiga job paralel sebelumnya, hanya jumlah slot runner yang turun.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz shard 1/3 (E-57)
        run: make fuzz SHARD=1/3
      - name: Fuzz shard 2/3 (E-57)
        run: make fuzz SHARD=2/3
      - name: Fuzz shard 3/3 (E-57)
        run: make fuzz SHARD=3/3

  # ADR-179: gate cakupan + benchmark absolut + acceptance fase dalam satu job. `make perf` dijalankan
  # paling awal agar budget absolut diukur di runner yang belum dipakai langkah berat lain. ADR-270:
  # target itu build semua binary dulu lalu menjalankan tiap paket pemilik benchmark serial (-p 1).
  extra:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Budget absolut benchmark (-tags goolm,perf; NEW-38, ADR-077)
        run: make perf
      - name: Acceptance performa F2 (recall p95 @1M, append p99; SPEC §11.6/§11)
        run: make perf-acceptance
      - name: PHASE berubah?
        id: phase
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan acceptance fase"; echo "run=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qx PHASE; then
            echo "PHASE berubah: $(cat PHASE)"; echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "PHASE tidak berubah: acceptance fase tidak perlu dijalankan"; echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.phase.outputs.run == 'true'
        run: make phase-acceptance
      - name: Coverage per paket critical (E-58, AUD-059)
        run: make coverage

  # E-58 (+ AUD-059) E-59 perf, ADR-080 acceptance fase.
  # CODE-TOOLS §10.3 CT-21 + NEW2-07 (modul bench): parity grep vs rg 15.1.0 di korpus nyata C1+C3
  # (`bench/corpora.lock`; tanpa korpus test gagal, bukan skip: DAMNBOT_REQUIRE_CORPORA=1) dan seluruh test
  # modul bench. Satu job (ADR-179); korpus + rg tetap di-cache. CT-01/02/03 dan CT-11 berjalan di nightly
  # bench-codetools.
  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/damnbot-corpora
          key: corpora-c1c3-${{ hashFiles('bench/corpora.lock', 'scripts/corpora.sh', 'bench/gencorpus/**') }}
      - name: Parity grep vs rg di korpus C1+C3 (CT-21, E-59)
        run: make bench-parity CORPORA="C1 C3 rg" CORPORA_DIR="$RUNNER_TEMP/damnbot-corpora"
      - name: Seluruh test modul bench (NEW2-07)
        run: make bench-budget

  # E-46/E-47/E-50 (tidy, verify, deps.allow, go-licenses + TestMPLIsolation) dan E-54 (govulncheck).
  # Satu job (ADR-179): semuanya membaca modul/ketergantungan yang sama.
  supply:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tier != 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            bench/go.sum
      # ADR-182: retry idempoten hanya pada jalur unduhan yang tersentuh gate, bukan pra-unduh.
      # Pra-unduh `go mod download all` DITOLAK karena ia menulis go.sum (8 baris untuk 4 modul pada
      # pohon nyata) dan membuat gate `tidy-check` di langkah berikutnya gagal — persis kegagalan yang
      # terlihat di PR ini. Gate tetap tidak dilonggarkan: bila 3 percobaan gagal, langkah gagal.
      - name: Gate modul dengan retry transient (E-46/E-47/E-45/E-48/E-40/E-54; ADR-182)
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if (( n >= 3 )); then
                echo "::error::$*: gagal setelah 3 percobaan (transient?)"
                return 1
              fi
              echo "$*: percobaan $n gagal; jeda 5 s lalu ulang"
              sleep 5
            done
          }
          retry make tidy-check
          retry make mod-verify
          retry make deps-check
          retry make licenses
          retry make release-test
          retry make vuln

  # ADR-181: tier `smoke` untuk `push: main`. Yang diperiksa: kompilasi seluruh paket (`make build`,
  # E-39), `go vet` lintas OS/arch (`make vet-cross`, ADR-073), dan suite paket inti yang cepat
  # (`make test RACE=-race PKGS=…`, E-55) di luar paket ber-fixture berat (ctxdb, exec, codetools, e2e)
  # yang sudah diverifikasi PR yang di-squash dan tetap dijalankan nightly. `lint` dan `static`
  # (loc, loc-ratio, size-check, deadcode) berjalan di semua tier; `meta-test` datang dari meta.yml.
  # ADR-181 amandemen (2026-10-23): langkah suite E-55 menimpa `CGO_ENABLED=1` (`-race` butuh cgo);
  # env workflow tetap `CGO_ENABLED=0` dan `make build` tetap memaku 0 di resepnya (E-39).
  smoke:
    needs: changes
    if: needs.changes.outputs.tier == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Kompilasi seluruh paket, CGO_ENABLED=0 -tags goolm (E-39)
        run: make build
      - name: go vet lintas OS/arch (ADR-073)
        run: make vet-cross
      - name: Suite paket inti cepat (E-55)
        env:
          CGO_ENABLED: "1" # ADR-181 amandemen: -race butuh cgo (pola sama dengan job `test` tier PR)
        run: make test RACE="-race" PKGS="./cmd/... ./internal/archtest/... ./internal/assemble/... ./internal/boundary/... ./internal/budget/... ./internal/compaction/... ./internal/config/... ./internal/journal/... ./internal/loop/... ./internal/memory/... ./internal/modules/... ./internal/netx/... ./internal/provider/... ./internal/redact/... ./internal/sandbox/... ./internal/schema/... ./internal/skills/... ./internal/testutil/... ./internal/tools/..."

  # GAP-SEC-26 (ADR-133/ADR-187): builtin skills carry no dangling requires,
  # skill:// links or script paths. The suite is empty today; the rule fires
  # the moment a builtin skill is added.
  skill-refs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Builtin skill references (GAP-SEC-26)
        run: make skill-refs

  # GAP-REL-04 (ADR-132/ADR-187): the embedded SQLite engine must satisfy
  # REL-04 (>= 3.51.3 + FTS5/trigram/json_valid) on all 8 canonical E-39
  # targets. Six targets have hosted runners; linux/arm and android/arm64 have
  # none (QEMU is the F9 item, ADR-073), so those legs cross-compile the
  # engine test as the target-coverage proof until then.
  sqlite-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux/amd64, mode: run}
          - {os: ubuntu-24.04-arm, target: linux/arm64, mode: run}
          - {os: ubuntu-latest, target: linux/arm, mode: cross}
          - {os: macos-latest, target: darwin/arm64, mode: run}
          - {os: macos-15-intel, target: darwin/amd64, mode: run}
          - {os: windows-latest, target: windows/amd64, mode: run}
          - {os: windows-11-arm, target: windows/arm64, mode: run}
          - {os: ubuntu-latest, target: android/arm64, mode: cross}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Engine probe (${{ matrix.target }})
        if: matrix.mode == 'run'
        run: make sqlite-engine
      - name: Cross-compile (${{ matrix.target }}, no runner; QEMU at F9)
        if: matrix.mode == 'cross'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: make sqlite-engine-cross GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"

  # ADR-135 butir 2: satu-satunya status `ci` yang wajib di branch protection. Selalu berjalan (termasuk
  # docs-only dan PR matrix yang diperkecil) dan lulus bila setiap gate sukses atau dilewati sah; job
  # matrix yang sengaja tidak ada di tier PR tidak lagi meninggalkan "Expected — waiting".
  # ADR-179/ADR-181: `needs` mengikuti pengemasan job dan tier; setiap gate Makefile tetap terwakili.
  ci-required:
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-timing
      - static
      - portability
      - fuzz
      - extra
      - bench
      - supply
      - smoke
      - skill-refs
      - sqlite-engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rekap gate (E-78)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            printf '::error::gate gagal atau dibatalkan: %s\n' "$(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "E-78: semua gate PR hijau atau dilewati sah"
