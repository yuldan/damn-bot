# CI per PR dan push main (ENGINEERING §5, ROADMAP F1 #0, ADR-073, ADR-135). Setiap job (kecuali `changes`
# dan `ci-required`) memanggil target Makefile yang sama dengan lokal (GAP-INF-05), sehingga `make meta-test`
# menguji perintah yang sama. Action dipin SHA commit + komentar versi, checkout tanpa kredensial tersimpan
# (AUD-070). Hemat menit runner (repo privat; macOS ×10, Windows ×2): hanya `test` berjalan di matrix OS,
# gate lain (lint, size, loc, …) cukup di ubuntu karena hasilnya tidak bergantung OS host.
#
# ADR-135 (antrean CI): PR docs-only melewati job Go, PR menjalankan matrix `test` yang diperkecil, dan
# `cancel-in-progress` hanya untuk PR (push main dan nightly tidak pernah dibatalkan). Status wajib branch
# protection adalah job agregat `ci-required`: ia selalu berjalan dan lulus bila setiap gate sukses atau
# dilewati sah oleh path/tier, sehingga job yang dilewati tidak membuat PR menggantung "Expected".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # ADR-135: nightly menjalankan matrix PENUH lewat workflow ini.

permissions:
  contents: read

# ADR-135 butir 1: cancel-in-progress hanya untuk PR. Push `main` (dan nightly via workflow_call) memakai
# grup yang sama tetapi tidak pernah dibatalkan — run baru menunggu, run lama selalu selesai.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"

jobs:
  # ADR-135 butir 2: PR yang hanya menyentuh dokumen tidak menjalankan build/test/perf/coverage/fuzz.
  # Dokumen yang isinya divalidasi test Go (SPEC.md, §2.4/budget ENGINEERING, DECISIONS, ROADMAP,
  # FEATURE-PARITY, CODE-TOOLS, ATTRIBUTION) tetap memicu job Go. Bukan PR (push main, workflow_call):
  # selalu jalankan semua job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: PR docs-only?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # ADR-135 butir 3: matrix `test` bertingkat. PR = 3 target (ubuntu race, macOS arm64, Windows
          # amd64); push main dan workflow_call (nightly) = 6 target berrunner.
          full='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"ubuntu-24.04-arm","race":"-race","cgo":"1"},{"os":"macos-latest","race":"-race","cgo":"1"},{"os":"macos-15-intel","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"},{"os":"windows-11-arm","race":"","cgo":"0"}]}'
          reduced='{"include":[{"os":"ubuntu-latest","race":"-race","cgo":"1"},{"os":"macos-latest","race":"-race","cgo":"1"},{"os":"windows-latest","race":"-race","cgo":"1"}]}'
          if [ "$EVENT" = pull_request ]; then
            echo "test_matrix=$reduced" >>"$GITHUB_OUTPUT"
          else
            echo "test_matrix=$full" >>"$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" != pull_request ]; then
            echo "bukan PR: semua job Go berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan semua job Go"
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          # Dokumen yang dibaca test Go (readRepoFile/parity/codetools/attribution) atau mendefinisikan
          # budget: perubahan di sini wajib menjalankan test yang memvalidasinya.
          validated='^(SPEC\.md|docs/(ENGINEERING|DECISIONS|ROADMAP|FEATURE-PARITY|CODE-TOOLS|ATTRIBUTION)\.md)$'
          # Docs-only = setiap path di docs/** ATAU Markdown di AKAR repo (README/CHANGELOG). Markdown di
          # subdirektori lain (internal/**/testdata/SKILL.md, template, golden, .github/*.md) bukan docs:
          # file itu dibaca test/kode Go dan tetap memicu semua job Go (ADR-135 butir 2).
          if printf '%s\n' "$changed" | grep -Ev '^(docs/|[^/]*\.md$)' | grep -q .; then
            echo "ada path non-dokumen: job Go berjalan"
            echo "code=true" >>"$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq "$validated"; then
            echo "dokumen divalidasi test berubah: job Go berjalan"
            printf '%s\n' "$changed" | grep -E "$validated"
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs-only: job Go dilewati, gate dokumen tetap berjalan"
            printf '%s\n' "$changed"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: golangci-lint (E-51)
        run: make lint
      - name: Analyzer khusus nohttpclient (E-05)
        run: make vet-custom

  # E-55: 6 target berrunner — linux amd64/arm64, darwin arm64/amd64, windows amd64/arm64 (linux/arm +
  # android/arm64 di QEMU tetap F9, ADR-073). ADR-090: ctxdb Windows termasuk TestFileLockSemantics,
  # S023, S044, TestPlatformNAList. windows/arm64 tanpa -race (Go tidak punya race detector di sana).
  # ADR-135 butir 3: PR cukup ubuntu-latest + macos-latest (arm64) + windows-latest (amd64); push main
  # dan nightly menjalankan keenam target.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: ${{ matrix.cgo }} # -race butuh cgo; build rilis tetap CGO_ENABLED=0 (job size, build-matrix)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum # kunci cache = go.sum + versi Go (dalam kunci setup-go)
      - name: GNU make tersedia (image Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - run: make test RACE="${{ matrix.race }}"

  # ADR-048 (TS-P08): budget waktu dinding tanpa -race; cek kebenaran skenario yang sama tetap berjalan
  # di job `test` (-race).
  test-timing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-timing

  # ADR-073 (AUD-033): go vet windows/darwin × amd64/arm64. Murah dan menangkap sebagian besar
  # kerusakan platform, jadi tetap berjalan di PR (ADR-135 butir 3).
  vet-cross:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make vet-cross

  # E-39/E-65: CGO_ENABLED=0 -tags goolm untuk 8 target kanonik.
  build-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make build-matrix

  # E-57: 60 s per target Fuzz*, 3 shard paralel.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make fuzz SHARD=${{ matrix.shard }}/3

  # E-58 (+ AUD-059): kritis ≥ 80 %, lain ≥ 70 %.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make coverage

  # E-53: deadcode -test, GOOS linux/darwin/windows digabung.
  deadcode:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make deadcode

  # ADR-073/077, NEW-38: budget waktu absolut benchmark (-tags goolm,perf; ×1,5 runner bersama).
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make perf

  # CODE-TOOLS §10.3 CT-21: parity grep vs rg 15.1.0 di korpus nyata C1+C3 (bench/corpora.lock). Korpus +
  # rg di-cache; tanpa korpus test gagal, bukan skip (DAMNBOT_REQUIRE_CORPORA=1). CT-01/02/03 dan CT-11
  # berjalan di nightly bench-codetools.
  bench-parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/damnbot-corpora
          key: corpora-c1c3-${{ hashFiles('bench/corpora.lock', 'scripts/corpora.sh', 'bench/gencorpus/**') }}
      - run: make bench-parity CORPORA="C1 C3 rg" CORPORA_DIR="$RUNNER_TEMP/damnbot-corpora"

  size:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make size-check

  loc-budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: LOC per paket + total, direktori tak terpetakan (E-19, AUD-073)
        run: make loc
      - name: Rasio test:source (E-70)
        run: make loc-ratio

  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            bench/go.sum
      - name: go mod tidy tanpa diff, 3 modul (E-46)
        run: make tidy-check
      - name: go mod verify, 3 modul (E-47)
        run: make mod-verify
      - name: deps allowlist (E-45, E-48)
        run: make deps-check
      - name: go-licenses + TestMPLIsolation (E-40)
        run: make licenses

  # E-54: per PR di sini, harian terhadap main di nightly.yml (AUD-071).
  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            bench/go.sum
      - run: make vuln

  # Modul bench (NEW2-07): seluruh test modul bench, termasuk harness token P1.
  bench-budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - run: make bench-budget

  # ADR-080 butir 2: acceptance fase bila file PHASE berubah; selain itu lulus dengan pesan.
  phase-acceptance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: PHASE berubah?
        id: phase
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base tidak diketahui: jalankan acceptance fase"; echo "run=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qx PHASE; then
            echo "PHASE berubah: $(cat PHASE)"; echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "PHASE tidak berubah: acceptance fase tidak perlu dijalankan"; echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.phase.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.phase.outputs.run == 'true'
        run: make phase-acceptance

  # GAP-SEC-26 (ADR-133/ADR-144): builtin skills carry no dangling requires,
  # skill:// links or script paths. The suite is empty today; the rule fires
  # the moment a builtin skill is added.
  skill-refs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Builtin skill references (GAP-SEC-26)
        run: make skill-refs

  # GAP-REL-04 (ADR-132/ADR-144): the embedded SQLite engine must satisfy
  # REL-04 (>= 3.51.3 + FTS5/trigram/json_valid) on all 8 canonical E-39
  # targets. Six targets have hosted runners; linux/arm and android/arm64 have
  # none (QEMU is the F9 item, ADR-073), so those legs cross-compile the
  # engine test as the target-coverage proof until then.
  sqlite-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux/amd64, mode: run}
          - {os: ubuntu-24.04-arm, target: linux/arm64, mode: run}
          - {os: ubuntu-latest, target: linux/arm, mode: cross}
          - {os: macos-latest, target: darwin/arm64, mode: run}
          - {os: macos-15-intel, target: darwin/amd64, mode: run}
          - {os: windows-latest, target: windows/amd64, mode: run}
          - {os: windows-11-arm, target: windows/arm64, mode: run}
          - {os: ubuntu-latest, target: android/arm64, mode: cross}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Engine probe (${{ matrix.target }})
        if: matrix.mode == 'run'
        run: make sqlite-engine
      - name: Cross-compile (${{ matrix.target }}, no runner; QEMU at F9)
        if: matrix.mode == 'cross'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: make sqlite-engine-cross GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"

  # ADR-135 butir 2: satu-satunya status `ci` yang wajib di branch protection. Selalu berjalan (termasuk
  # docs-only dan PR matrix yang diperkecil) dan lulus bila setiap gate sukses atau dilewati sah; job
  # matrix yang sengaja tidak ada di tier PR tidak lagi meninggalkan "Expected — waiting".
  ci-required:
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-timing
      - vet-cross
      - build-matrix
      - fuzz
      - coverage
      - deadcode
      - perf
      - bench-parity
      - size
      - loc-budget
      - supply-chain
      - vuln
      - bench-budget
      - phase-acceptance
      - skill-refs
      - sqlite-engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rekap gate (E-78)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            printf '::error::gate gagal atau dibatalkan: %s\n' "$(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "E-78: semua gate PR hijau atau dilewati sah"
