# Rilis Damn-Bot (ROADMAP F3; CROSS-CUTTING §1.4/§1.5). Artefak baru diterima bila DUA build
# terpisah byte-identik (-trimpath, -buildvcs=true, SOURCE_DATE_EPOCH dari commit, CGO_ENABLED=0,
# tags goolm). Setiap artefak mendapat SBOM dari `go version -m` (stdlib), satu SHA256SUMS stabil,
# dan tanda tangan ed25519. Kunci hanya dari secret GitHub: DAMNBOT_RELEASE_KEY (material base64) +
# DAMNBOT_RELEASE_PASSPHRASE; kunci publik ada di repository variable DAMNBOT_RELEASE_PUBKEY.
# Tanpa secret/variable, job gagal keras (scripts/sign-release.sh & verify-release.sh fail-closed).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Dua build byte-identik + SBOM
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_PUBKEY: ${{ vars.DAMNBOT_RELEASE_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_PUBKEY" ]; then
            echo "REPRODUCIBLE GAGAL: repository variable DAMNBOT_RELEASE_PUBKEY kosong"; exit 1
          fi
          RELEASE_VERSION=${GITHUB_REF_NAME#v} REQUIRE_CLEAN=1 REQUIRE_VCS=1 scripts/release-build.sh \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: sums, manifest, tanda tangan, Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # GAP-INF-04: tag + riwayat migrasi untuk TestChangelogPerTag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS stabil
        run: |
          set -euo pipefail
          : >dist/SHA256SUMS
          while IFS= read -r f; do
            (cd dist && sha256sum -- "$f")
          done < <(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' -printf '%f\n' | LC_ALL=C sort) \
            >>dist/SHA256SUMS
          lines=$(wc -l <dist/SHA256SUMS)
          if [ "$lines" -lt 12 ]; then
            echo "SHA256SUMS tidak lengkap: $lines baris (< 12 = 6 target x biner+SBOM)"; exit 1
          fi
      - name: Tanda tangan ed25519 (fail-closed)
        env:
          DAMNBOT_RELEASE_KEY: ${{ secrets.DAMNBOT_RELEASE_KEY }}
          DAMNBOT_RELEASE_PASSPHRASE: ${{ secrets.DAMNBOT_RELEASE_PASSPHRASE }}
        run: scripts/sign-release.sh dist/SHA256SUMS
      - name: Verifikasi ulang tanda tangan + checksum (fail-closed)
        env:
          DAMNBOT_RELEASE_PUBKEY: ${{ vars.DAMNBOT_RELEASE_PUBKEY }}
        run: scripts/verify-release.sh --dir dist
      - name: Changelog per tag (fail-closed)
        env:
          DAMNBOT_CHANGELOG_TAG: ${{ github.ref_name }}
        run: go test ./internal/update -run '^TestChangelogPerTag$' -count=1
      - name: release.json (manifest bertanda tangan)
        run: |
          set -euo pipefail
          scripts/release-manifest.sh "${GITHUB_REF_NAME#v}"
      - name: Tanda tangan release.json (fail-closed)
        env:
          DAMNBOT_RELEASE_KEY: ${{ secrets.DAMNBOT_RELEASE_KEY }}
          DAMNBOT_RELEASE_PASSPHRASE: ${{ secrets.DAMNBOT_RELEASE_PASSPHRASE }}
          DAMNBOT_RELEASE_FILE: ${{ github.workspace }}/dist/release.json
        run: (cd tools && go test -run '^TestSignReleaseFile$' -count=1 ./release)
      - name: Verifikasi release.json + SHA256SUMS (fail-closed)
        env:
          DAMNBOT_RELEASE_PUBKEY: ${{ vars.DAMNBOT_RELEASE_PUBKEY }}
          DAMNBOT_RELEASE_MANIFEST: ${{ github.workspace }}/dist/release.json
          DAMNBOT_RELEASE_MANIFEST_SIG: ${{ github.workspace }}/dist/release.json.sig
        run: go test ./internal/update -run '^TestVerifyReleaseManifestFile$' -count=1
      - name: Ringkasan
        run: cat dist/SHA256SUMS >>"$GITHUB_STEP_SUMMARY"
      - name: Publikasikan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/changelog.md" \
              "${prerelease[@]}" dist/*
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
