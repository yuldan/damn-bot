<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>damnbot settings</title>
<meta name="damnbot-csrf" content="{{.CSRF}}">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="bar">
  <h1>Settings</h1>
  <a href="/">Dashboard</a>
</header>
<main>
  <section class="card">
    <h2>Language</h2>
    <p class="muted">Current: <strong id="language">{{.Language}}</strong> (config key <code>ui.language</code>).</p>
    {{if .Writable}}
    <form id="settings-form">
      <label for="language-select">Language</label>
      <select id="language-select">
        <option value="auto">auto</option>
        {{range .Locales}}<option value="{{.}}">{{.}}</option>{{end}}
      </select>
      <button type="submit">Preview change</button>
    </form>
    <pre id="diff" class="diff" hidden></pre>
    <button id="apply" type="button" hidden>Apply change</button>
    <p id="settings-status" class="muted"></p>
    {{else}}
    <p class="muted">This build keeps settings read-only.</p>
    {{end}}
  </section>
  <script type="module" src="/assets/settings.js"></script>
  <section class="card">
    <h2>Theme</h2>
    <p class="muted">The dashboard follows the terminal theme family (`tern-dark` by default).</p>
  </section>
</main>
</body>
</html>
