<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.T "web.title"}}</title>
<meta name="damnbot-csrf" content="{{.CSRF}}">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-msg-signed-in="{{.T "web.signed_in"}}" data-msg-waiting-provider="{{.T "web.waiting_provider"}}" data-msg-expired="{{.T "web.expired"}}" data-msg-stream-open="{{.T "web.stream_open"}}" data-msg-reconnecting="{{.T "web.reconnecting"}}">
<header class="bar">
  <h1>{{.T "web.title"}}</h1>
  <p id="principal" class="muted"></p>
  <a href="/settings">{{.T "web.settings"}}</a>
  <button id="logout" type="button">{{.T "web.sign_out"}}</button>
</header>
<main id="app">
  <section class="card" id="session">
    <h2>{{.T "web.session"}}</h2>
    <p id="session-state" class="muted" role="status" aria-live="polite">{{.T "web.connecting"}}</p>
    <p id="provider-state" class="muted" role="status" aria-live="polite"></p>
  </section>
  <section class="card" id="events" role="log" aria-live="polite" aria-relevant="additions">
    <h2>{{.T "web.events"}}</h2>
    <p id="events-state" class="muted">{{.T "web.waiting"}}</p>
    <div id="transcript"></div>
  </section>
</main>
<dialog id="approval" role="dialog" aria-modal="true" aria-labelledby="approval-title">
  <h2 id="approval-title">{{.T "critical.approval.title"}}</h2>
  <p id="approval-body" class="muted"></p>
  <button id="approval-deny" type="button">{{.T "web.deny"}}</button>
  <button id="approval-ok" type="button">{{.T "web.approve"}}</button>
</dialog>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
