# damnbot tools.lock — GAP-TOOL-06, F6-W1.
#
# Declarative inventory of every tool the F6 modules contribute to the
# deferred catalog. One line per tool:
#
#   <module> <tool> <version> <sha256(schema bytes)>
#
# `TestToolsLockComplete` fails when a registered F6 tool is missing here,
# when an entry names a tool that is not registered, or when the schema hash
# and the module constant drift apart. A schema edit therefore updates this
# file in the same commit as the module.
#
# Slots: media, voice and computeruse add their lines when their registration
# lands (ADR-309). No entry means no registered tool. Web (W1) and browser
# (W2) are registered.

